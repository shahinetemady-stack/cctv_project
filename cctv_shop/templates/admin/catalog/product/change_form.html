{% extends "admin/change_form.html" %}
{% block admin_change_form_document_ready %}
{{ block.super }}
<script>
(function() {
    var map = {
        'board':   'ویژگی‌های برد دوربین',
        'lens':    'ویژگی‌های لنز دوربین',
        'modem':   'ویژگی‌های متعلقات',
        'housing': 'ویژگی‌های بدنه دوربین',
    };
    var specTitles = Object.values(map);

    // ── پیش‌فرض قسمت ثابت نام محصول بر اساس دسته‌بندی (قابل ویرایش است) ──
    var NAME_PREFIX = {
        '1':  'برد دوربین مداربسته ',
        '10': 'برد دوربین مداربسته AHD پنج مگاپیکسل ',
        '11': 'برد دوربین مداربسته IP پنج مگاپیکسل ',
        '9':  'برد دستگاه ضبط تصاویر ',
        '12': 'برد دستگاه DVR مدل ',
        '13': 'برد دستگاه NVR مدل ',
        '2':  'لنز دوربین مداربسته ',
        '19': 'لنز و هولدر پنج مگاپیکسل دوربین مداربسته مدل ',
        '25': 'لنز موتورایز پنج مگاپیکسل دوربین مداربسته مدل ',
        '26': 'لنز و آی‌آر کات وری‌فوکال پنج مگاپیکسل دوربین مداربسته ',
        '3':  'کیس دوربین مداربسته مدل ',
        '14': 'کیس بولت فلزی دوربین مداربسته مدل ',
        '15': 'کیس دام دوربین مداربسته مدل ',
        '16': 'کابل دوربین مداربسته ',
        '17': 'مودم سیم‌کارتی 4G ',
        '23': 'ال‌ای‌دی وارم‌لایت دوربین مداربسته مدل ',
    };

    function isPrefixOnly(value) {
        var v = value.trim();
        if (!v) return true;
        return Object.keys(NAME_PREFIX).some(function(k) {
            return NAME_PREFIX[k].trim() === v;
        });
    }

    function applyNamePrefix(catId, focus) {
        var nameField = document.getElementById('id_name');
        if (!nameField) return;
        var prefix = NAME_PREFIX[String(catId)];
        if (!prefix) return;
        if (!isPrefixOnly(nameField.value)) return;  // متن دستی کاربر را خراب نکن
        nameField.value = prefix;
        if (focus) {
            nameField.focus();
            nameField.setSelectionRange(prefix.length, prefix.length);
        }
    }

    function applyFilter(catType) {
        document.querySelectorAll('fieldset').forEach(function(fs) {
            var h2 = fs.querySelector('h2');
            if (!h2) return;
            var title = h2.textContent.trim();
            if (specTitles.indexOf(title) === -1) return;
            if (!catType) {
                fs.style.display = 'none';
            } else if (map[catType] === title) {
                fs.style.display = '';
                fs.classList.remove('collapsed');
            } else {
                fs.style.display = 'none';
            }
        });
    }

    function getCatType(catId, focusName) {
        if (!catId) { applyFilter(''); return; }
        applyNamePrefix(catId, focusName);
        fetch('/api/catalog/categories/')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var cats = Array.isArray(data) ? data : (data.results || []);
                var cat = cats.find(function(c) { return String(c.id) === String(catId); });
                applyFilter(cat ? cat.category_type : '');
            });
    }

    var catField = document.getElementById('id_category');
    if (catField) {
        getCatType(catField.value, false);
        catField.addEventListener('change', function() { getCatType(this.value, true); });
    }
})();
</script>
{% endblock %}
