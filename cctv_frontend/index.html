    <script type="application/ld+json">

      "@type": "WebSite",
      "name": "دوربینکار",
      "url": "https://doorbinkar.com/",
      "inLanguage": "fa-IR",
      "potentialAction": {
        "@type": "SearchAction",

    <!-- اعمال تم قبل از اولین رندر (جلوگیری از فلش) -->
    <script>
      try {
        var __t = JSON.parse(localStorage.getItem('site-theme') || '{}').state;
        document.documentElement.dataset.theme = (__t && __t.theme) || 'dark';
        if (__t && __t.theme === 'light') document.documentElement.classList.remove('dark');
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
