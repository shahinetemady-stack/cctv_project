# تشخیص نوع ربات بر اساس User-Agent:
#   social → فقط متای OG اشتراک‌گذاری (واتساپ، تلگرام، بله و…)
#   search → رندر داینامیک HTML کامل (گوگل، بینگ و خزنده‌های AI) — الگوی رسمی
#            «Dynamic Rendering» گوگل برای SPA؛ محتوا معادل صفحه‌ای است که
#            کاربر بعد از اجرای JS می‌بیند.
# نتیجه map در هدر X-Bot-Kind به Django داده می‌شود (apps/core/views.py).
map $http_user_agent $bot_kind {
    default "";
    # ربات‌های پیش‌نمایش لینک پیام‌رسان‌ها
    ~*(WhatsApp|TelegramBot|Telegram|Twitterbot|facebookexternalhit|Facebot|Slackbot|LinkedInBot|Discordbot|Pinterest|Bale|Eitaa) "social";
    # موتورهای جستجو
    ~*(Googlebot|Google-InspectionTool|Bingbot|DuckDuckBot|YandexBot|Applebot) "search";
    # Torob price-comparison platform crawler (reads product meta from no-JS HTML)
    ~*(Torob) "search";
    # خزنده‌های هوش مصنوعی
    ~*(GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-User|Claude-SearchBot|anthropic-ai|PerplexityBot|Perplexity-User|meta-externalagent|Meta-ExternalAgent|Bytespider|CCBot|Amazonbot|cohere-ai|YouBot) "search";
}

server {
    listen 80 default_server;
    listen 8443 ssl;
    server_name 185.116.162.244 doorbinkar.com www.doorbinkar.com _;

    # یکسان‌سازی دامنه برای سئو: www → non-www (۳۰۱)
    if ($host = www.doorbinkar.com) {
        return 301 https://doorbinkar.com$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/doorbinkar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doorbinkar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/cctv/frontend;
    index index.html;
    client_max_body_size 50M;

    # فشرده‌سازی پاسخ‌های متنی — کاهش payload شبکه (Lighthouse: enable-text-compression)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/woff2;
    gzip_vary on;

    # مسیرهای *.json ناشناخته باید 404 واقعی بدهند، نه index.html با 200 —
    # وگرنه خزنده‌ها/auditها (مثل ai-catalog.json) HTML را به‌جای JSON می‌بینند
    location ~ ^/(?!api/|static/|media/).*\.json$ {
        try_files $uri =404;
    }

    location /torob_api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 150s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 150s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # پنل جنگو — فقط مسیرهای واقعی ادمین جنگو
    location = /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/admin/(login|logout|password_change|jsi18n|admin|auth|authtoken|token_blacklist|accounting|catalog|core|education|inventory|notifications|orders|payment|users)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # بقیه مسیرهای /admin/... متعلق به پنل مدیریت فرانت (SPA) است
    location /admin/ {
        try_files $uri $uri/index.html /index.html;
    }
    location /media/ {
        alias /opt/cctv/backend/media/;
        expires 30d;
    }
    location /static/ {
        alias /opt/cctv/backend/staticfiles/;
        expires 30d;
    }
    # استاتیک‌های هش‌دار بیلد Vite — کش بلندمدت امن است
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

# ────────────────────────────────────────────────────────────────
# ریدایرکت ۳۰۱ URLهای سایت قدیمی doorbinkar.com
# ────────────────────────────────────────────────────────────────
# مسیرهای قدیمی «/cat/<عدد>/...» و «/products/<عدد>/...»
# به بک‌اند (گانیکورن) پاس داده می‌شوند تا بر اساس legacy_id
# ریدایرکت ۳۰۱ به URL جدید انجام شود.
# مسیرهای جدید SPA (/products/<slug> بدون عدد) دست‌نخورده می‌مانند.

location ~ ^/cat/\d+(/|$) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ~ ^/products/\d+(/|$) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# مقالات قدیمی: /blog/<عدد>/<slug> → بک‌اند (ریدایرکت ۳۰۱)
# توجه: /blog و /blog/<slug متنی> جدید همچنان توسط SPA سرو می‌شوند
location ~ ^/blog/\d+(/|$) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# ربات‌ها (سوشال + جستجو/AI) به Django پروکسی می‌شوند؛ بقیه SPA می‌گیرند.
# این بلاک باید بعد از بلاک‌های ریدایرکت legacy (عددی) باشد تا URLهای قدیمی اول match شوند.
location ~ ^/(products|categories|packages|blog|videos)/[^/]+/?$ {
    # proxy_set_header باید بیرون از if باشد (nginx داخل if اجازه نمی‌دهد)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Bot-Kind $bot_kind;
    if ($bot_kind) {
        proxy_pass http://127.0.0.1:8000;
    }
    try_files $uri $uri/index.html /index.html;
}

# صفحات ثابت سایت قدیمی — ریدایرکت مستقیم در nginx (بدون بک‌اند)
location = /about-us   { return 301 https://doorbinkar.com/; }
location = /rules      { return 301 https://doorbinkar.com/terms; }
location = /complaints { return 301 https://doorbinkar.com/; }
location = /search     { return 301 https://doorbinkar.com/products; }
location = /login      { return 301 https://doorbinkar.com/auth/login; }
location = /register   { return 301 https://doorbinkar.com/auth/register; }

# سایت‌مپ داینامیک از بک‌اند
location = /sitemap.xml {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# llms.txt داینامیک از بک‌اند (راهنمای خزنده‌های AI)
location = /llms.txt {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

    location = /sw.js {
        # no-store: مرورگر هرگز sw.js را کش نکند — وگرنه آپدیت سرویس‌ورکر گیر
        # کش HTTP می‌افتد و نسخه قدیمی برای کاربران باقی می‌ماند
        add_header Cache-Control "no-store" always;
        expires off;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location / {
        try_files $uri $uri/index.html /index.html;
        # index.html نباید کش شود تا بعد از هر دیپلوی نسخه تازه دیده شود
        add_header Cache-Control no-cache;
    }
}
