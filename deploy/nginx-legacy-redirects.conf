# ────────────────────────────────────────────────────────────────
# ریدایرکت ۳۰۱ URLهای سایت قدیمی doorbinkar.com
# ────────────────────────────────────────────────────────────────
# این بلاک‌ها باید هنگام انتقال دامنه به کانفیگ nginx سرور
# (/etc/nginx/sites-enabled/cctv) اضافه شوند — قبل از location /.
#
# منطق: مسیرهای قدیمی «/cat/<عدد>/...» و «/products/<عدد>/...»
# به بک‌اند (گانیکورن) پاس داده می‌شوند تا بر اساس legacy_id
# ریدایرکت ۳۰۱ به URL جدید انجام شود.
# مسیرهای جدید SPA (/products/<slug> بدون عدد) دست‌نخورده می‌مانند.

location ~ ^/cat/\d+ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ~ ^/products/\d+ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# مقالات قدیمی: /blog/<عدد>/<slug> → بک‌اند (ریدایرکت ۳۰۱)
# توجه: /blog و /blog/<slug متنی> جدید همچنان توسط SPA سرو می‌شوند
location ~ ^/blog/\d+ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# صفحات ثابت سایت قدیمی — ریدایرکت مستقیم در nginx (بدون بک‌اند)
location = /about-us   { return 301 /; }
location = /rules      { return 301 /terms; }
location = /complaints { return 301 /; }
location = /search     { return 301 /products; }
location = /login      { return 301 /auth/login; }
location = /register   { return 301 /auth/register; }

# سایت‌مپ داینامیک از بک‌اند
location = /sitemap.xml {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
